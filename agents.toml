# Agent registry. Each agent is either:
#   type = "cli"  - a local command-line agent (codex, kimi, opencode, ...)
#   type = "api"  - a cloud model behind an OpenAI-compatible endpoint
# Add agents by copying a block. UI and planner pick agents up automatically.
#
# tier = "strong" | "fast"  — the planner sends review/finalize/polish work to
# strong agents only; fast agents get drafts, ideas, and simple steps.
# Override any agent's tier in Settings (stored in settings.toml).

orchestrator = "codex"

# ---------------- CLI agents ----------------

[agents.codex]
type = "cli"
tier = "strong"
description = "OpenAI Codex CLI. Strong at coding, refactoring, shell tasks."
strengths = ["coding", "debugging", "refactoring", "shell", "general"]
command = 'codex exec --skip-git-repo-check -s workspace-write --cd "{workdir}" -'
stdin = true
shell = true
timeout_sec = 900
status = "ready"

[agents.opencode]
type = "cli"
tier = "strong"
description = "OpenCode CLI with free OpenCode Zen models — no key needed. Pick the model in Settings."
strengths = ["coding", "editing", "general"]
command = 'opencode run -m "{model}" "{prompt}"'
resume_command = 'opencode run -c -m "{model}" "{prompt}"'
default_model = "opencode/glm-5.3-flash-free"
stdin = false
shell = true
timeout_sec = 900
status = "ready"
[agents.opencode.env]
XDG_DATA_HOME = ".harness/xdg-data"

[agents.claude]
type = "cli"
tier = "strong"
description = "Claude Code CLI (Anthropic). Agentic coding, reasoning, refactoring — full file access."
strengths = ["coding", "reasoning", "debugging", "refactoring", "general"]
command = 'claude -p --dangerously-skip-permissions < "{promptfile}"'
resume_command = 'claude -p -c --dangerously-skip-permissions < "{promptfile}"'
promptfile = true
shell = true
timeout_sec = 900
status = "ready"
install = "npm install -g @anthropic-ai/claude-code — then run claude once to sign in"

[agents.echo]
type = "echo"
tier = "fast"
description = "Built-in dry-run agent. Costs nothing; for testing orchestration."
strengths = ["testing"]
status = "ready"
timeout_sec = 10

# ---------------- Free cloud models (type = "api") ----------------
# These need a provider key in keys.toml (see keys.toml.example).
# `models` are tried in order until one answers (rate-limit failover).

[agents.kimi]
type = "api"
tier = "strong"
provider = "moonshot"
models = ["kimi-k3", "kimi-k2.6", "kimi-k2.7-code"]
description = "Kimi K3 via Moonshot API. Long-context reading, research, writing, coding."
strengths = ["research", "long-context", "writing", "analysis", "coding"]
status = "needs-key"
timeout_sec = 300

[agents.or-auto]
type = "api"
tier = "fast"
provider = "openrouter"
models = ["openrouter/free"]
description = "OpenRouter auto-router: picks any currently-available free model."
strengths = ["general", "writing", "analysis"]
status = "needs-key"
timeout_sec = 240

